name:
  type: str
name_nix:
  type: str
  when: false
namespace:
  type: str
  when: false
_skip_if_exists:
  - "{{ name }}/flake-module.nix"
  - "{{ name }}/nixos-module.nix"
_tasks:
  - [chmod, u+rw, "{{ name }}/flake-module.nix", "{{ name }}/nixos-module.nix"]
  - [git, add, --, "{{ name }}/flake-module.nix", "{{ name }}/nixos-module.nix"]
